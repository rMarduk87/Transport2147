plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.devtools.ksp'
    id 'com.google.android.libraries.mapsplatform.secrets-gradle-plugin'
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace 'rpt.games.transport2147'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "rpt.games.transport2147"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
            arg("room.incremental", "true")
            arg("room.expandProjection", "true")
        }

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        compose true
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.core.ktx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.espresso.core
    androidTestImplementation libs.androidx.junit
    //AndroidX
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview
    implementation libs.androidx.gridlayout
    implementation libs.flexbox
    //Misc
    implementation libs.material
    implementation libs.jsr305
    implementation libs.androidx.activity.ktx
    implementation libs.kotlin.reflect
    //Lottie
    implementation libs.lottie
    implementation libs.timber
    //Firebase
    implementation(libs.firebase.analytics.ktx) // Replace with the latest version
    //Crashlytics
    implementation(libs.firebase.crashlytics) // Example version
    //Lifecycle
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation libs.androidx.lifecycle.common.java8
    //Room
    implementation "androidx.room:room-runtime:$room_version"
    implementation libs.androidx.room.ktx
    implementation libs.androidx.core
    implementation libs.androidx.work.runtime.ktx
    implementation libs.navigation.fragment.ktx
    ksp("androidx.room:room-compiler:$room_version")
    //FastAdapter
    implementation libs.fastadapter
    implementation libs.fastadapter.extensions.binding
    implementation libs.fastadapter.extensions.expandable
    implementation libs.fastadapter.extensions.utils
    //Balloon
    implementation(libs.balloon)
    //App Base
    implementation libs.rptbase
    //SplashScreen
    implementation libs.androidx.splashscreen
    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.foundation
    implementation libs.androidx.compose.foundation.layout
}
